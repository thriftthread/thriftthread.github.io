<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Household Money Tracker</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:Arial;background:#f4f6f8;padding:15px}
.card{background:#fff;padding:15px;border-radius:10px;margin-bottom:15px}
input,select,button{width:100%;padding:8px;margin-top:6px}
button{background:#2563eb;color:#fff;border:none;border-radius:6px}
.warn{color:#dc2626;font-weight:bold}
.flex{display:flex;gap:10px;flex-wrap:wrap}
.flex>div{flex:1;min-width:260px}
</style>
</head>
<body>
<h2>🏠 Household Money Tracker</h2>

<div class="card">
<label>Total House Money (₹)</label>
<input id="totalMoney" type="number" />
<button onclick="setTotal()">Save</button>
<h3>Remaining Balance: ₹<span id="balance">0</span></h3>
</div>

<div class="card">
<h3>Add Expense</h3>
<label>Who Spent</label>
<input id="user" placeholder="Name" />

<label>Amount Spent (₹)</label>
<input id="spent" type="number" placeholder="e.g. 150" />

<label>Change Returned (₹) (after coming home)</label>
<input id="change" type="number" placeholder="e.g. 60" />

<label>Category</label>
<select id="category"></select>

<button onclick="addExpense()">Add Expense</button>
<p id="error" class="warn"></p>
</div>

<div class="flex">
<div class="card"><canvas id="pie"></canvas></div>
<div class="card"><h3>Reports</h3><p id="daily"></p><p id="weekly"></p><p id="monthly"></p></div>
</div>

<div class="card">
<h3>Export</h3>
<button onclick="exportCSV()">Export to Excel (CSV)</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, collection, addDoc, onSnapshot, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAPn0C5umD3bkO6eMb39JfTsU5g2jTZ_ng",
  authDomain: "expanse-e8e8c.firebaseapp.com",
  projectId: "expanse-e8e8c",
  storageBucket: "expanse-e8e8c.firebasestorage.app",
  messagingSenderId: "132890161638",
  appId: "1:132890161638:web:26aba4dd5f2c15bd1be627"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Offline + Auto Sync
enableIndexedDbPersistence(db).catch(()=>{});

const categories = ['Food','Street Food','Groceries','Bills','Rent','Travel','Education','Medical','Fuel','Shopping','Emergency','Misc'];
categories.forEach(c=>category.appendChild(new Option(c,c)));

let expenses=[]; let chart;

async function setTotal(){ await setDoc(doc(db,'meta','money'),{total:Number(totalMoney.value)}); }

async function addExpense(){
 const name=user.value||'Unknown';
 const spentAmt=Number(spent.value);
 const changeAmt=Number(change.value)||0;
 const actual=spentAmt;

 if(actual<=0){error.textContent='Invalid spent amount';return;}

 const meta=await getDoc(doc(db,'meta','money'));
 const total=meta.data().total||0;
 let spentTotal=expenses.reduce((s,e)=>s+e.amount,0);

 if(actual>total-spentTotal){error.textContent='Not enough balance';return;}
 error.textContent='';

 await addDoc(collection(db,'expenses'),{
  user:name,
  amount:actual,
  change:changeAmt,
  category:category.value,
  date:new Date()
 });(collection(db,'expenses'),{
  user:name,
  amount:actual,
  taken:takenAmt,
  change:changeAmt,
  category:category.value,
  date:new Date()
 });

 change.value='';
}

onSnapshot(collection(db,'expenses'),snap=>{expenses=[];snap.forEach(d=>expenses.push(d.data()));render();});
onSnapshot(doc(db,'meta','money'),d=>{if(d.exists()){balance.textContent=d.data().total-expenses.reduce((s,e)=>s+e.amount,0);}});

function render(){
 let totals={};
 expenses.forEach(e=>totals[e.category]=(totals[e.category]||0)+e.amount);
 if(chart)chart.destroy();
 chart=new Chart(pie,{type:'pie',data:{labels:Object.keys(totals),datasets:[{data:Object.values(totals)}]}});

 const now=new Date();
 const day=expenses.filter(e=>new Date(e.date).toDateString()==now.toDateString()).reduce((s,e)=>s+e.amount,0);
 const week=expenses.filter(e=>(now-new Date(e.date))<=7*864e5).reduce((s,e)=>s+e.amount,0);
 const month=expenses.filter(e=>new Date(e.date).getMonth()==now.getMonth()).reduce((s,e)=>s+e.amount,0);
 daily.textContent='Today: ₹'+day;
 weekly.textContent='This week: ₹'+week;
 monthly.textContent='This month: ₹'+month;
}

function exportCSV(){
 let csv='User,Amount,Category,Date\n';
 expenses.forEach(e=>csv+=`${e.user},${e.amount},${e.category},${new Date(e.date).toLocaleString()}\n`);
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([csv]));
 a.download='house-expenses.csv';
 a.click();
}
</script>
</body>
</html>
